services:
  - type: web
    name: repeato
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/repeato.sqlite
      - key: JWT_SECRET
        generateValue: true
